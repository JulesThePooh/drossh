<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Drossh</title>
</head>
<body>
<div id="app">

  <!-- ===== Zone GAUCHE : explorateur de fichiers (SFTP) ===== -->
  <aside class="panel panel--files">
    <div class="panel__head">
      <span class="panel__title">Fichiers</span>
      <div class="panel__actions">
        <button id="files-refresh" class="icon-btn" title="Actualiser" aria-label="Actualiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
        </button>
      </div>
      <button id="files-collapse" class="icon-btn panel__toggle" title="Replier" aria-label="Replier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
    </div>
    <div class="panel__path" id="files-path">/ · aucune connexion</div>
    <div class="panel__body">
      <div class="tree" id="files-tree">
        <div class="tree__empty">
          Connecte-toi à un serveur<br/>pour voir ses fichiers.
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== Zone CENTRE : terminal ===== -->
  <main class="terminal">
    <div class="tabs" id="tabs">
      <div class="tabs__list" id="tabs-list"></div>
      <button id="new-tab-btn" class="tab__new" title="Nouvelle connexion">+</button>
    </div>
    <div class="terminal__screen">
      <div id="term-stack" class="term-stack"></div>
      <div id="welcome" class="term-welcome">
        <pre class="term-text">
<span class="c-accent">Drossh</span> — client SSH léger

  Aucune session ouverte.
</pre>
        <button id="quick-connect-btn" class="btn-cta">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          Nouvelle connexion
        </button>
      </div>
      <div id="loader" class="loader" style="display:none;">
        <div class="spinner"></div>
        <span>Connexion…</span>
      </div>
    </div>
  </main>

  <!-- ===== Zone DROITE : connexions sauvegardées ===== -->
  <aside class="panel panel--conns">
    <div class="panel__head">
      <button id="conns-collapse" class="icon-btn panel__toggle panel__toggle--right" title="Replier" aria-label="Replier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <span class="panel__title">Connexions</span>
      <div class="panel__actions">
        <button id="new-folder-btn" class="icon-btn" title="Nouveau dossier" aria-label="Nouveau dossier">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
        <button id="new-conn-btn" class="icon-btn icon-btn--accent" title="Nouvelle connexion" aria-label="Nouvelle connexion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="panel__search">
      <input id="conn-filter" type="text" placeholder="Filtrer…" />
    </div>
    <div class="panel__body">
      <div class="tree" id="conn-tree"></div>
    </div>
  </aside>

  <!-- ===== Barre d'état ===== -->
  <footer class="statusbar">
    <span class="statusbar__item">Prêt</span>
    <span class="statusbar__spacer"></span>
    <span class="statusbar__item statusbar__item--muted">Drossh v0.1 · aucune session</span>
  </footer>

  <!-- ===== Poignées de redimensionnement ===== -->
  <div class="resizer resizer--files" id="resizer-files"></div>
  <div class="resizer resizer--conns" id="resizer-conns"></div>

  <!-- ===== Fenêtre : nouvelle / modifier connexion ===== -->
  <div id="conn-modal" class="modal" style="display:none;">
    <div class="modal__box">
      <div class="modal__head">
        <span id="conn-modal-title">Nouvelle connexion</span>
        <button id="conn-modal-close" class="icon-btn" title="Fermer">✕</button>
      </div>
      <div class="modal__body">
        <div class="row">
          <label class="grow">Nom
            <input id="f-name" type="text" placeholder="Mon serveur" autocomplete="off"/>
          </label>
          <label class="port-lg">Dossier
            <select id="f-folder"></select>
          </label>
        </div>
        <div class="row">
          <label class="grow">Hôte
            <input id="f-host" type="text" placeholder="exemple.com ou 1.2.3.4" autocomplete="off"/>
          </label>
          <label class="port">Port
            <input id="f-port" type="number" value="22"/>
          </label>
        </div>
        <label>Utilisateur
          <input id="f-user" type="text" placeholder="root" autocomplete="off"/>
        </label>

        <div class="auth-tabs">
          <button class="auth-tab auth-tab--active" data-auth="password" type="button">Mot de passe</button>
          <button class="auth-tab" data-auth="key" type="button">Clé enregistrée</button>
        </div>

        <div id="auth-password" class="auth-pane">
          <label>Mot de passe
            <input id="f-password" type="password" autocomplete="off"/>
          </label>
        </div>
        <div id="auth-key" class="auth-pane" style="display:none;">
          <label>Clé SSH
            <select id="f-keyid"></select>
          </label>
          <button id="manage-keys-btn" class="btn-link" type="button">＋ Gérer les clés…</button>
        </div>

        <div id="conn-error" class="modal__error" style="display:none;"></div>
      </div>
      <div class="modal__foot">
        <button id="conn-cancel" class="btn-ghost" type="button">Annuler</button>
        <button id="conn-save" class="btn-ghost" type="button">Enregistrer</button>
        <button id="conn-save-connect" class="btn-primary" type="button">Enregistrer &amp; connecter</button>
      </div>
    </div>
  </div>

  <!-- ===== Fenêtre : gestionnaire de clés SSH ===== -->
  <div id="key-modal" class="modal" style="display:none;">
    <div class="modal__box">
      <div class="modal__head">
        <span>Clés SSH enregistrées</span>
        <button id="key-modal-close" class="icon-btn" title="Fermer">✕</button>
      </div>
      <div class="modal__body">
        <div id="key-list" class="key-list"></div>
        <div class="key-add">
          <div class="key-add__title">Ajouter une clé</div>
          <label>Nom
            <input id="k-name" type="text" placeholder="Ma clé perso" autocomplete="off"/>
          </label>
          <div class="field">
            <span class="field__label">Chemin de la clé <strong>privée</strong></span>
            <div class="field__row">
              <input id="k-path" type="text" placeholder="~/.ssh/id_ed25519" autocomplete="off"/>
              <button id="k-browse" class="btn-ghost btn-browse" type="button">Parcourir…</button>
            </div>
          </div>
          <label>Passphrase <span class="dim">(si la clé en a une)</span>
            <input id="k-passphrase" type="password" autocomplete="off"/>
          </label>
          <div id="key-error" class="modal__error" style="display:none;"></div>
        </div>
      </div>
      <div class="modal__foot">
        <button id="key-modal-done" class="btn-ghost" type="button">Fermer</button>
        <button id="key-add-btn" class="btn-primary" type="button">Ajouter la clé</button>
      </div>
    </div>
  </div>

  <!-- ===== Petite fenêtre : saisie texte (ex. nom de dossier) ===== -->
  <div id="text-modal" class="modal" style="display:none;">
    <div class="modal__box modal__box--sm">
      <div class="modal__head">
        <span id="text-modal-title">Titre</span>
        <button id="text-modal-close" class="icon-btn" title="Fermer">✕</button>
      </div>
      <div class="modal__body">
        <label id="text-modal-label">Nom
          <input id="text-modal-input" type="text" autocomplete="off"/>
        </label>
      </div>
      <div class="modal__foot">
        <button id="text-modal-cancel" class="btn-ghost" type="button">Annuler</button>
        <button id="text-modal-ok" class="btn-primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <!-- ===== Petite fenêtre : confirmation ===== -->
  <div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal__box modal__box--sm">
      <div class="modal__head"><span>Confirmer</span></div>
      <div class="modal__body">
        <p id="confirm-modal-text" class="confirm-text"></p>
      </div>
      <div class="modal__foot">
        <button id="confirm-modal-no" class="btn-ghost" type="button">Annuler</button>
        <button id="confirm-modal-yes" class="btn-primary" type="button">Supprimer</button>
      </div>
    </div>
  </div>

</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
