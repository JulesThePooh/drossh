name: drossh
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Jules Pauly <paulyjules@gmail.com>
description: |
  Client SSH léger avec terminal, gestionnaire de connexions et explorateur SFTP.
vendor: Jules Pauly
homepage: https://github.com/JulesThePooh/drossh
license: MIT
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
contents:
  - src: ./build/bin/drossh
    dst: /usr/bin/drossh
  - src: ./packaging/drossh.desktop
    dst: /usr/share/applications/drossh.desktop
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/drossh.png
  - src: ./build/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/drossh.svg
