name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            imagemagick patchelf file fuse3 desktop-file-utils python3 curl

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Compiler (webkit 4.1)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -tags webkit2_41 -clean

      - name: Empaqueter (tarball + .deb + AppImage)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 1200 bash packaging/linux-package.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  linux-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dépendances Arch
        run: pacman -Syu --noconfirm --needed base-devel git go nodejs npm webkit2gtk-4.1 gtk3

      - uses: actions/checkout@v4

      - name: Compiler (Arch, webkit 4.1)
        run: |
          export GOPATH=/root/go
          export PATH="$PATH:/root/go/bin"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          wails build -tags webkit2_41 -clean

      - name: Empaqueter le binaire Arch
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp build/bin/drossh pkg/drossh
          cp packaging/drossh.desktop pkg/
          cp build/appicon.png pkg/drossh.png
          cp build/appicon.svg pkg/drossh.svg
          cp LICENSE pkg/
          mkdir -p dist
          tar -C pkg -czf "dist/drossh-$VER-archlinux-x86_64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Compiler
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean

      - name: Renommer l'exécutable
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/drossh.exe "dist/Drossh-${GITHUB_REF_NAME#v}-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, linux-arch, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
