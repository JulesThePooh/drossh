name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Compiler
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean

      - name: Empaqueter (tarball + .deb + AppImage)
        run: bash packaging/linux-package.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Compiler
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean

      - name: Renommer l'exécutable
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/drossh.exe "dist/Drossh-${GITHUB_REF_NAME#v}-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
